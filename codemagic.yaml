# Codemagic CI — CalibraHub KMP mobil (iOS build)
# ─────────────────────────────────────────────────────────────────────────────
# Repo:      github.com/bilalakyuz61/CalibraHub
# KMP proje: mobile/CalibraHubKmp   (mevcut mobile/CalibraHubAndroid'e DOKUNMAZ)
# Bu dosya repo KÖKÜNDE olmalı — Codemagic yapılandırmayı burada arar.
#
# İki workflow:
#   1) ios-compile-check  → İMZASIZ derleme kanıtı. Apple Developer hesabı GEREKMEZ.
#                           İlk çalıştırılacak workflow budur ("iOS derleniyor mu?").
#   2) ios-testflight     → İMZALI IPA + TestFlight. Apple Developer hesabı + Codemagic'te
#                           App Store Connect entegrasyonu kurulunca kullanılır.
#
# NOT: Otomatik push-trigger BİLİNÇLİ olarak KONMADI — bu repoda src/ her tur otomatik
#      commit'leniyor; her push'ta iOS build tetiklenmesin diye workflow'lar Codemagic
#      arayüzünden ELLE (ya da tag ile) tetiklenir.
# ─────────────────────────────────────────────────────────────────────────────

workflows:

  ios-compile-check:
    name: iOS derleme kontrolu (imzasiz)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Tag ile OTOMATİK tetik: `ios-check-*` etiketi push'lanınca bu workflow calisir.
    # main'e her push'ta (src/ auto-commit) DEGIL — sadece kasitli etiketlerde.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-check-*'
          include: true
    environment:
      xcode: latest
      vars:
        KMP_DIR: "mobile/CalibraHubKmp"
    scripts:
      - name: XcodeGen kur (yoksa)
        script: which xcodegen || brew install xcodegen
      - name: Xcode projesini uret (xcodegen)
        script: |
          cd "$KMP_DIR/iosApp"
          xcodegen generate
      - name: gradlew calistirilabilir yap
        script: chmod +x "$KMP_DIR/gradlew"
      - name: iOS uygulamasini derle (imzasiz, simulator SDK)
        script: |
          cd "$KMP_DIR/iosApp"
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS TestFlight (imzali) — Apple + Codemagic ayari GEREKIR
    instance_type: mac_mini_m2
    max_build_duration: 90
    # ⬇ Codemagic UI → Teams/App settings → Integrations → App Store Connect ile bir
    #   API anahtari olustur ve adini buraya yaz. Apple Developer hesabi ($99/yil) sart.
    integrations:
      app_store_connect: CalibraHub ASC
    environment:
      # Xcode 26.4'e YUKSELTILDI (2026-08-20) — App Store Connect artik yukleme icin iOS 26 SDK
      # (Xcode 26+) ZORUNLU kiliyor ("built with iOS 18.5 SDK... must be built with iOS 26 SDK").
      # Onceki pin (16.4) tam da bu yuzden Apple'in yeni kuraliyla CELISIYORDU. Daha once
      # `xcode: latest` (=26.4.1) ile eski Kotlin 2.1.0 arasinda LINKER CRASH vardi (Ld iosApp ->
      # clang "PLEASE ATTACH ... linker snapshot") — kok neden Kotlin/Native 2.1.0'in Xcode 26'nin
      # yeni linker toolchain'iyla uyumsuzlugu idi, Xcode surumu DEGIL. Kotlin gradle/libs.versions.toml'da
      # 2.2.21'e yukseltildi (JetBrains resmi compat tablosunda Xcode 26.0 destegi ilk kez bu
      # surumde listelenir) -> linker crash kok nedeninden cozuldu, artik Xcode 26 GEREKLI ve
      # GUVENLI. "latest" yerine somut "26.4" pinlendi (bu projenin disiplini: gelecekte Codemagic
      # yeni bir Xcode majorune atlarsa sessiz kirilma yerine acikca guncellenmesi gerekir).
      xcode: 26.4
      # ELLE saglanan imzalama: sertifika+profil BIZ olusturduk (openssl CSR -> Apple Distribution
      # cert -> .p12 + App Store provisioning profil). Codemagic'in otomatik cert olusturma sorununu
      # tamamen atlar. "ios_signing" grubundaki secret'lardan gelir (Codemagic UI'da eklenir):
      #   CM_CERTIFICATE           = base64 .p12
      #   CM_CERTIFICATE_PASSWORD  = .p12 sifresi
      #   CM_PROVISIONING_PROFILE  = base64 .mobileprovision
      # (CalibraHub ASC entegrasyonu yalniz TestFlight YUKLEME icin — publishing bolumu.)
      groups:
        - ios_signing
      vars:
        KMP_DIR: "mobile/CalibraHubKmp"
    scripts:
      - name: XcodeGen kur (yoksa)
        script: which xcodegen || brew install xcodegen
      - name: Xcode projesini uret (xcodegen)
        script: |
          cd "$KMP_DIR/iosApp"
          xcodegen generate
      - name: Build numarasini ayarla (TestFlight her yuklemede tekil olmali)
        script: |
          cd "$KMP_DIR/iosApp"
          # Codemagic'in artan build sayaci ($BUILD_NUMBER) -> CFBundleVersion.
          # xcodegen Info.plist'i uretmis olmali (info.path: iosApp/Info.plist).
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER:-1}" iosApp/Info.plist
      - name: gradlew calistirilabilir yap
        script: chmod +x "$KMP_DIR/gradlew"
      - name: Kod imzalama (elle saglanan sertifika + profil)
        script: |
          # Elle saglanan .p12 + .mobileprovision'i keychain'e/profil klasorune kur, projeye uygula.
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist_cert.p12
          keychain add-certificates --certificate /tmp/dist_cert.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_HOME/CalibraHub_App_Store.mobileprovision"
          cd "$KMP_DIR/iosApp"
          xcode-project use-profiles
      - name: IPA derle (imzali)
        script: |
          cd "$KMP_DIR/iosApp"
          xcode-project build-ipa \
            --project iosApp.xcodeproj \
            --scheme iosApp
    artifacts:
      - $KMP_DIR/iosApp/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # false = IPA yalnizca YUKLENIR (App Store Connect isler, build TestFlight'ta hazir olur).
        # true iken Codemagic HARICI (external) beta incelemesine gonderiyordu ve Apple
        # "Beta App Information: Feedback Email" + "Beta App Review Information: First/Last Name,
        # Phone, Email" zorunlu kildigi icin adim KIRMIZI oluyordu. Bizim ihtiyacimiz DAHILI
        # (internal) test: App Store Connect > TestFlight > Internal Testing grubuna tester eklemek
        # yeterli, beta incelemesi ve bu formlar GEREKMEZ. Ileride harici testere acilirsa
        # once test-info doldurulup bu true yapilir.
        submit_to_testflight: false
