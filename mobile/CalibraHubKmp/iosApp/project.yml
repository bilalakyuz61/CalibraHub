# XcodeGen spec — iosApp Xcode projesini üretir (elle .xcodeproj yazmak kırılgan olduğu için).
# Codemagic (veya bir Mac) build öncesi `xcodegen generate` çalıştırır → iosApp.xcodeproj oluşur.
# KMP `shared` framework'ü preBuildScript ile derlenip linklenir (embedAndSignAppleFrameworkForXcode).
name: iosApp
options:
  bundleIdPrefix: com.calibrahub
  deploymentTarget:
    iOS: "14.0"
settings:
  base:
    # Yeni Xcode'da Gradle'ın framework'ü build klasörüne yazabilmesi için sandbox kapalı.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: CalibraHub KMP
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # App Store yukleme dogrulamasi (altool) icin ZORUNLU — asset catalog'daki AppIcon
        # appiconset ile eslesir (bkz. ASSETCATALOG_COMPILER_APPICON_NAME asagida). Eksikse
        # "Missing Info.plist value ... CFBundleIconName" hatasi verir.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        # Uygulama portrait-kilitli tasarlandi (bkz. AppNavHost/ekranlar — yatay layout YOK).
        # TARGETED_DEVICE_FAMILY = "1" (yalniz iPhone) oldugu icin iPad multitasking'in
        # zorunlu kildigi 4 yonelim (Portrait+PortraitUpsideDown+LandscapeLeft+LandscapeRight)
        # GEREKMEZ — yalniz Portrait yeterli ve dogru (iPad hedeflenmiyor).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Geliştirme backend'i HTTP (cleartext) → ATS gevşetildi. PRODUCTION'da KALDIR.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Faz 3 — AVFoundation kamera erişimi (barkod tarama). Bu anahtar olmadan
        # AVCaptureDevice/AVCaptureSession ilk kullanımda uygulamayı çökertir (iOS zorunlu kılar).
        NSCameraUsageDescription: "Barkod okutmak için kamera erişimi gerekir."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calibrahub.mobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # App Store yukleme dogrulamasi — asset catalog'daki AppIcon.appiconset'i (tek 1024x1024
        # "universal" kaynak, iosApp/Assets.xcassets) app icon olarak kullan. Xcode gerekli tum
        # rasterize boyutlari (120x120 iPhone, 152x152 iPad vb.) bu tek kaynaktan turetir.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Uygulama portrait-kilitli + iPad hedeflenmiyor (bkz. yukarida orientation notu) →
        # yalniz iPhone ("1"). Bu, iPad icon (152x152) + iPad multitasking yonelim zorunlulugunu
        # (Portrait,PortraitUpsideDown,LandscapeLeft,LandscapeRight) tamamen ortadan kaldirir —
        # App Store Connect yukleme dogrulamasindaki 2 hatanin (icon 152x152 + yonelim) kok nedeni.
        TARGETED_DEVICE_FAMILY: "1"
        # Manuel imzalama (Codemagic use-profiles provisioning profil'i buraya ekler).
        # DEVELOPMENT_TEAM = Apple Team ID (BILAL AKYUZ). Codemagic archive CODE_SIGN_STYLE=Manual
        # ile calisiyor; team + manuel stil ayari olmadan "requires a provisioning profile" verir.
        DEVELOPMENT_TEAM: D74BM279A2
        CODE_SIGN_STYLE: Manual
        # KMP framework arama yolu (embedAndSignAppleFrameworkForXcode buraya kopyalar).
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - shared
    preBuildScripts:
      - name: KMP shared framework derle
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          cd "$SRCROOT/.."
          # Heap AYRICA komut satirindan veriliyor: Kotlin/Native Release link adimi
          # (linkReleaseFrameworkIosArm64) 2 GB ile OOM oluyordu. gradle.properties'teki
          # org.gradle.jvmargs, CI imajinin ~/.gradle/gradle.properties'i tarafindan EZILEBILIR
          # (home dizini proje dosyasindan onceliklidir) — komut satiri argumani ise her ikisini de
          # ezer, yani bellek ayarinin uygulanmasi GARANTI olur.
          ./gradlew -Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m" \
            :shared:embedAndSignAppleFrameworkForXcode
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    archive:
      config: Release
