# 2026-08-21: 2048m -> 6144m. Codemagic iOS Release archive'inda Kotlin/Native derleyicisi
# "Compilation failed: Java heap space / java.lang.OutOfMemoryError" ile cokuyordu. Kotlin/Native
# derleyicisi Gradle daemon'inin ICINDE calisir, dolayisiyla belirleyici ayar budur (Android/JVM
# derlemesi 2 GB ile sorunsuzdu — iOS Release + tum Compose agaci cok daha fazla heap ister).
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# Kotlin JVM derleme daemon'i icin de ayni bollukta heap (Android tarafi ayri process'te derler).
kotlin.daemon.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
