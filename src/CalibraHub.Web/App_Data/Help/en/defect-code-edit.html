<div class="calibra-help-doc">
  <p class="help-lead">
    The Defect Code Edit screen defines/edits a quality defect code.
  </p>
  <h3>Fields</h3>
  <ul>
    <li><b>Defect name</b> (e.g. Scratch, Out of Tolerance) and, if applicable, <b>category/class</b>.</li>
    <li>Description and status (active/inactive), if applicable.</li>
  </ul>
  <h3>Saving</h3>
  <p><b>Save</b> stores the record; <b>Back</b> returns to the list without saving.</p>
</div>
