<div class="calibra-help-doc">
  <p class="help-lead">
    The Sales Representative Edit screen defines/edits a sales representative's details.
  </p>
  <h3>Fields</h3>
  <ul>
    <li><b>Name</b> (required) and status (active/inactive).</li>
    <li>Contact and additional details, if any.</li>
  </ul>
  <h3>Saving</h3>
  <p><b>Save</b> stores the record; <b>Back</b> returns to the list without saving.</p>
</div>
