<div class="calibra-help-doc">
  <p class="help-lead">
    The Card Group Edit screen defines or edits a group.
  </p>
  <h3>Fields</h3>
  <ul>
    <li><b>Group name</b>, the <b>parent group</b> it belongs to (level) and the scope (material/account).</li>
  </ul>
  <h3>Saving</h3>
  <p><b>Save</b> stores the record; <b>Back</b> returns to the list without saving.</p>
</div>
