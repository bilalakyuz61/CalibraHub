<div class="calibra-help-doc">
  <p class="help-lead">
    The Unit of Measure Edit screen defines/edits a unit of measure.
  </p>
  <h3>Fields</h3>
  <ul>
    <li><b>Unit name</b> (e.g. Piece, Kilogram) and abbreviation/symbol, if any.</li>
    <li>Status (active/inactive).</li>
  </ul>
  <h3>Saving</h3>
  <p><b>Save</b> stores the record; <b>Back</b> returns to the list without saving.</p>
</div>
