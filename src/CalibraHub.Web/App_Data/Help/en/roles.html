<div class="calibra-help-doc">
  <p class="help-lead">
    The Role Definition screen manages the roles assigned to users (system area).
  </p>
  <h3>What Is This Screen For?</h3>
  <ul>
    <li>Roles are defined here; each user is linked to one of these roles.</li>
    <li>Screen/action permissions for roles are granted from the "Permission Management" matrix.</li>
  </ul>
