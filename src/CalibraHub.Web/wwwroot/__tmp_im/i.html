<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/react/calibrahub-widgets.css">
<style>body{margin:0;padding:12px;background:#f8fafc}</style>
</head><body class="app-theme-light">
<div style="display:flex;flex-direction:column;height:520px"><div id="host" style="flex:1 1 0;min-height:0;display:flex;flex-direction:column"></div></div>
<script src="/react/calibrahub-widgets.js"></script>
<script>
function ent(i){return {id:i,title:'TKL-'+i,subtitle:'Cari '+i,widgets:[
 {id:'w_kod',type:'data',dataType:'text',label:'Teklif No',value:'TKL-'+i},
 {id:'w_ad',type:'data',dataType:'text',label:'Cari',value:'Cari '+i},
 {id:'total',type:'data',dataType:'currency',label:'Tutar',value:1000*i}]};}
window.CalibraHub.mountSmartBoard(document.getElementById('host'),{
 boardKey:'im-test', title:'Satis Siparisleri', subtitle:'3 siparis', icon:'ShoppingCart', iconColor:'emerald',
 viewMode:'table', searchPlaceholder:'ara', emptyText:'yok',
 iconMenu:[{id:'convert-to-orders',label:'Tekliften Sipariş Oluştur',icon:'ArrowRightCircle',url:'/Sales/ConvertToOrders'}],
 selectable:true,
 bulkActions:[{id:'create-orders',label:'Sipariş Oluştur',icon:'ShoppingCart',variant:'primary',apiUrl:'/Test/Bulk',apiMethod:'POST'}],
 masterWidgets:[{id:'w_kod',label:'Teklif No',dataType:'text',type:'data'},{id:'w_ad',label:'Cari',dataType:'text',type:'data'},{id:'total',label:'Tutar',dataType:'currency',type:'data'}],
 entities:[ent(1),ent(2),ent(3)]});
</script></body></html>
