<!doctype html>
<html lang="tr" class="dark">
<head>
<meta charset="utf-8">
<title>SQE ust bilgi repro</title>
<link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/lib/flatpickr/flatpickr.min.css">
<link rel="stylesheet" href="/css/calibra-datepicker.css">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="header.css">
<style>body{padding:24px;background:#0b1220}</style>
</head>
<body class="app-theme-dark">
<div class="sqe-hform">
  <div class="sqe-ident-row">
    <div class="sqe-ident-fields">
      <div class="sqe-hrow" data-field-key="customer">
        <label class="sqe-hlabel sqe-hlabel--link">Cari Kod</label>
        <input type="text" id="sqCustomerDisplay" class="form-control form-control-sm sqe-hinput" value="3201000024">
        <span id="sqCustomerName" class="sqe-hlabel-value sqe-customer-name">PLANET YAZILIM VERI ISLEM SISTEMLERI</span>
      </div>
    </div>
    <div class="sqe-ident-total" id="sqIdentGrandTotalWrap">
      <span class="sqe-ident-total-label">Genel Toplam</span>
      <span class="sqe-ident-total-value" id="sqGrandTotalIdentMirror">1.845,6000</span>
    </div>
  </div>

  <div class="sqe-strips">
    <div class="sqe-strip" data-sqe-section="1">
      <div class="sqe-hrow" data-field-key="quoteDate">
        <label class="sqe-hlabel">Tarih</label>
        <input id="sqQuoteDate" type="date" class="form-control form-control-sm sqe-hinput" value="2026-08-19">
      </div>
      <div class="sqe-hrow" data-field-key="validUntil">
        <label class="sqe-hlabel">Gecerlilik Gun/Tarih</label>
        <div class="sqe-hcombo">
          <input id="sqValidUntil" type="date" class="form-control form-control-sm sqe-hinput" value="2026-08-19">
          <input id="sqValidDays" type="number" min="0" class="form-control form-control-sm sqe-hinput sqe-fp-days" value="0">
        </div>
      </div>
      <div class="sqe-hrow" data-field-key="currency">
        <label class="sqe-hlabel">Para Birimi</label>
        <select id="sqCurrency" class="form-select form-select-sm sqe-hinput" style="max-width:90px;"><option>EUR</option></select>
      </div>
      <div class="sqe-hrow" id="sqExchangeRateWrap" data-field-key="exchangeRate">
        <label class="sqe-hlabel">Kur</label>
        <input id="sqExchangeRate" type="number" class="form-control form-control-sm sqe-hinput" style="max-width:88px;text-align:right;" value="54.5822">
      </div>
      <div class="sqe-hrow" id="sqRateDateWrap" data-field-key="rateDate">
        <label class="sqe-hlabel">Kur Tarihi</label>
        <input id="sqRateDate" type="date" class="form-control form-control-sm sqe-hinput" value="2026-08-19">
      </div>
      <div class="sqe-hrow" data-field-key="vatIncluded">
        <label class="sqe-hlabel">KDV Dahil</label>
        <label class="sqe-switch"><input type="checkbox"><span class="sqe-switch-track"><span class="sqe-switch-thumb"></span></span></label>
      </div>
    </div>
  </div>
</div>
<script src="/lib/flatpickr/flatpickr.min.js"></script>
<script src="/js/calibra-datepicker.js"></script>
</body></html>
